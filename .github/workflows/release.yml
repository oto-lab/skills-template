name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading "v" (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Enter a stable major.minor.patch version without a leading "v".'
            exit 1
          fi

          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
      - run: npm run check
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          if existing_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null)"; then
            # A retry can start on the original commit after the version commit and tag were pushed.
            if [[ "$existing_commit" != "$GITHUB_SHA" ]] &&
               { [[ "$(git rev-parse "$existing_commit^" 2>/dev/null)" != "$GITHUB_SHA" ]] ||
                 ! git diff --quiet "$existing_commit" --; }; then
              echo "$tag already points to $existing_commit."
              exit 1
            fi
            release_commit="$existing_commit"
          else
            if ! git diff --quiet -- package.json package-lock.json; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -- package.json package-lock.json
              git commit -m "release: $tag"
            fi

            release_commit="$(git rev-parse HEAD)"
            git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "HEAD:refs/tags/$tag"
          fi

          # Exclude this tag so a retry produces the same release notes.
          range="$release_commit"
          if previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$tag" "$release_commit" 2>/dev/null)"; then
            range="$previous_tag..$release_commit"
          fi
          notes="$RUNNER_TEMP/skill-release-notes.md"
          {
            echo "## Changes"
            echo
            git log "$range" --no-merges --format='- %s'
          } > "$notes"

          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"
