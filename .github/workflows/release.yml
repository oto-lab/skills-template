name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading "v" (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Enter a stable major.minor.patch version without a leading "v".'
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "package.json is $package_version, expected $RELEASE_VERSION."
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          if existing_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null)"; then
            if [[ "$existing_commit" != "$GITHUB_SHA" ]]; then
              echo "$tag already points to $existing_commit."
              exit 1
            fi
          else
            git push origin "$GITHUB_SHA:refs/tags/$tag"
          fi

          # Exclude this tag so a retry produces the same release notes.
          range="$GITHUB_SHA"
          if previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$tag" "$GITHUB_SHA" 2>/dev/null)"; then
            range="$previous_tag..$GITHUB_SHA"
          fi
          notes="$RUNNER_TEMP/skill-release-notes.md"
          {
            echo "## Changes"
            echo
            git log "$range" --no-merges --format='- %s'
          } > "$notes"

          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"
